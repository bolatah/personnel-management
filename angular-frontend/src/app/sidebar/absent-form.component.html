<form [formGroup]="absentForm" (ngSubmit)="markAbsent()">
<h2> Mark Absent</h2>
  <div class="form-field">
    <mat-form-field>
      <mat-select formControlName="selectedEmployeeId" placeholder="Select Employee">
        <mat-option *ngFor="let employee of employees" [value]="employee._id">
          {{ employee.personalInformation.name }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-field">
    <mat-form-field>
      <input matInput [matDatepicker]="startPicker" formControlName="startDate" placeholder="Start Date">
      <mat-datepicker-toggle matSuffix [for]="startPicker"></mat-datepicker-toggle>
      <mat-datepicker #startPicker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="form-field">
    <mat-form-field>
      <input matInput [matDatepicker]="endPicker" formControlName="endDate" placeholder="End Date">
      <mat-datepicker-toggle matSuffix [for]="endPicker"></mat-datepicker-toggle>
      <mat-datepicker #endPicker></mat-datepicker>
    </mat-form-field>
  </div>

  <div class="form-field">
    <mat-form-field>
      <mat-select formControlName="reason" placeholder="Absence Reason">
        <mat-option *ngFor="let reason of absenceReasonOptions" [value]="reason">
          {{ reason }}
        </mat-option>
      </mat-select>
    </mat-form-field>
  </div>

  <div class="form-field">
    <button mat-raised-button type="submit" color="primary" [disabled]="!absentForm.valid">Submit</button>
    <button mat-raised-button type="button" color="warn" (click)="cancel()">Cancel</button>
  </div>

</form>
