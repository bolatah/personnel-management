<div>
  <table class="table">
    <thead>
      <tr>
        <th>Name</th>
        <th>Birthday</th>
      </tr>
    </thead>
    <tbody>
      @for(employee of employeesHavingBirthday; track employee) {
        <tr >
          <td>{{ employee.personalInformation.name }}</td>
          <td>{{ employee.personalInformation.birthday | date:'dd-MM-yyyy' }}</td>
        </tr>
      }
     
    </tbody>
  </table>
</div>
