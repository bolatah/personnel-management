<div class="dashboard-container">
  <!-- First Line: Total Employees, Missing Employees, Birthdays -->
  <div class="dashboard-line">
    <mat-card class="dashboard-card">
      <div mat-card-header class="card-header">Total Employees</div>
      <div mat-card-content class="card-content">{{ employees.length }}</div>
    </mat-card>

    <mat-card class="dashboard-card">
        <div mat-card-header class="card-header">Missing Employees</div>
        <div mat-card-content class="card-content">{{ missingEmployees.length }}</div>
    </mat-card>

    <mat-card class="dashboard-card" title="Employees Having Birthday Soon!">
      <div class="card-header">Upcoming Birthdays</div>
      <div class="card-content" (click)="openUpcomingBirthdaysDialog()">{{ upcomingBirthdaysNumber }}</div>
    </mat-card>
  </div>
  <!-- Second Line: Bar Graph -->
  <div class="dashboard-line">
    <mat-card class="graph-card">
      <div class="card-header">Employees by Department</div>
      <div id="department" style="width: 100%; height: 400px;"></div>
    </mat-card>

    <mat-card class="graph-card">
      <div class="card-header">Employees by Position</div>
      <div id="position" style="width: 100%; height: 400px;"></div>
    </mat-card>
  </div>

</div>
