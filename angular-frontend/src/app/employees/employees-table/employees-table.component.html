
<div class="top-bar"> 
  <span mat-button (click)="openDialog('Add')" title="Add Employee" >
    <mat-icon>add</mat-icon>
  </span>
</div>

<div class="mat-elevation-z2">

  <table mat-table class="full-width-table" matSort [dataSource]="dataSource" aria-label="Elements">
    
    <!-- Id Column -->
    <ng-container matColumnDef="ID">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
      <td mat-cell *matCellDef="let row" title="{{row._id}}">{{ getShortenedId(row._id)  }}</td>
    </ng-container>

    <!-- Name Column -->
    <ng-container matColumnDef="Name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Name</th>
      <td mat-cell *matCellDef="let row">
        <a routerLink="/employees/{{ row._id }}">{{ row.personalInformation.name }}</a>
      </td>
    </ng-container>

    <!-- Birthday Column -->
    <ng-container matColumnDef="Birthday">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Birthday</th>
      <td mat-cell *matCellDef="let row">{{ row.personalInformation.birthday | date:'dd-MM-yyyy' }}</td>
    </ng-container>

    <!-- Position Column -->
    <ng-container matColumnDef="Position">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Position</th>
      <td mat-cell *matCellDef="let row">{{ row.employmentDetails.position }}</td>
    </ng-container>

    <!-- Department Column -->
    <ng-container matColumnDef="Department">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Department</th>
      <td mat-cell *matCellDef="let row">{{ row.employmentDetails.department }}</td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="Actions">
      <th mat-header-cell *matHeaderCellDef>Actions</th>
      <td mat-cell *matCellDef="let row">
        <mat-menu #menu="matMenu">
          <button mat-menu-item (click)="openDialog('Edit', row)" >Edit</button>
          <button mat-menu-item (click)="deleteEmployee(row)">Delete</button>
          <button mat-menu-item (click)="viewEmployeeDetails(row)">View Employee</button>
        </mat-menu>
        <button mat-icon-button [matMenuTriggerFor]="menu">
          <mat-icon>more_vert</mat-icon>
        </button>
      </td>
    </ng-container>

    <!-- Define table rows -->
    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>

  <mat-paginator #paginator [pageSizeOptions]="[5, 10, 20]" [pageSize]="10" [showFirstLastButtons]="true">
  </mat-paginator>
</div>
